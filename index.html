<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You, Monkey 🐵</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fff6f6;
      color: #333;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background: #ffccd5;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0;
    }
    p.message {
      font-size: 1.2rem;
      margin: 1rem auto;
      max-width: 600px;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2rem;
    }
    .gallery img, .gallery video {
      width: 250px;
      height: auto;
      margin: 10px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    button {
      margin-top: 2rem;
      padding: 1rem 2rem;
      font-size: 1rem;
      background-color: #ff9aa2;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
    .reveal {
      margin-top: 2rem;
      font-size: 1.2rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1>For You, Monkey 🐵</h1>
    <p class="message">I made this little page to share some memories and smiles with someone who means the world to me. Hope it brings a smile to your face like you do to mine!</p>
  </header>

  <div class="gallery">
    <img src="IMG_9931_Original.jpg" alt="Memory 1">
    <img src="IMG_9957-COLLAGE_Original.jpg" alt="Memory 2">
    <img src="8B937AA5-DB3F-47AC-8EEF-EA10335AF6D1_Original.jpg" alt="Memory 3">
    <video controls src="B84F3AEF-44CE-43B0-8542-5B9B4CFA0CA5.mov"></video>
  </div>

  <button onclick="document.getElementById('reveal').classList.remove('hidden')">Click to reveal a little secret 💌</button>
  
  <div id="reveal" class="reveal hidden">
    <p>I kinda sorta really like you... a lot. 😳❤️ Can you please unblock me on facebook?</p>
  </div>

</body>
</html>
